# pre-commit install  (pre-commit and pre-push hooks)
# SwiftLint and XcodeGen come from Homebrew: brew install swiftlint xcodegen
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint lint --strict --quiet
        language: system
        types: [swift]
      - id: jscpd
        name: Duplication (jscpd)
        entry: jscpd
        language: node
        additional_dependencies: [jscpd@5.4.2]
        pass_filenames: false
        types: [swift]
      # Builds the app: on push only.
      - id: dead-code
        name: Dead code (SwiftLint analyze)
        entry: scripts/dead-code.sh
        language: system
        pass_filenames: false
        types: [swift]
        stages: [pre-push]
