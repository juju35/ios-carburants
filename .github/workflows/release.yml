name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet: bump MARKETING_VERSION in
# project.yml, add its CHANGELOG.md section, push, and the release follows. The build number is the commit count.
#
# The release carries a simulator build (xcrun simctl install booted Carburants.app). With an App Store Connect
# API key in the secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_KEY (the .p8
# file's content) and the APPLE_TEAM_ID variable, the app is also archived, signed by Xcode (cloud signing) and
# uploaded to App Store Connect for TestFlight.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Xcode 27 runner image: 27.1 carries the iOS 27.1 SDK (iPhone Duo).
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml)"
          test -n "$VERSION"
          grep -q "^## $VERSION$" CHANGELOG.md || { echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the project
        if: steps.version.outputs.exists == 'false'
        run: |
          brew install xcodegen xcbeautify
          xcodegen

      - name: Simulator build
        if: steps.version.outputs.exists == 'false'
        run: |
          set -o pipefail
          xcodebuild build -project Carburants.xcodeproj -scheme Carburants -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/Carburants.app \
            "carburants-${{ steps.version.outputs.version }}-simulator.zip"
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: carburants-${{ steps.version.outputs.version }}-simulator.zip
          body_path: notes.md
          make_latest: true

      - name: Upload to App Store Connect
        if: steps.version.outputs.exists == 'false' && env.ASC_KEY != ''
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$TEAM_ID" \
            || { echo "::error::APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and the APPLE_TEAM_ID variable are needed too"; exit 1; }
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$ASC_KEY" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")

          xcodebuild archive -project Carburants.xcodeproj -scheme Carburants -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Carburants.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            "${auth[@]}" | xcbeautify --renderer github-actions

          /usr/libexec/PlistBuddy -c "Clear dict" \
            -c "Add :method string app-store-connect" -c "Add :destination string upload" \
            -c "Add :teamID string $TEAM_ID" -c "Add :signingStyle string automatic" \
            -c "Add :uploadSymbols bool true" -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/Carburants.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            "${auth[@]}" | xcbeautify --renderer github-actions
          echo "::notice::Build ${{ steps.version.outputs.build }} of ${{ steps.version.outputs.version }} sent to App Store Connect (TestFlight after processing)"

      - name: No App Store Connect key
        if: steps.version.outputs.exists == 'false' && env.ASC_KEY == ''
        run: echo "::warning::No App Store Connect key in the secrets, GitHub release only (nothing sent to TestFlight)"
