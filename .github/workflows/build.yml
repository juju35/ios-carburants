name: Build

# Generates the Xcode project, builds the app with its widget for the simulator (no signing) and runs
# CarburantsKit's tests, with the iOS 27.1 SDK (iPhone Duo). SwiftLint's analyzer looks for unused code in the
# app build's compiler log.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Xcode 27 runner image: 27.0 (default), 27.1, 27.2 beta; 27.1 carries the iOS 27.1 SDK.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Generate the project
        run: |
          xcodebuild -version
          brew install xcodegen xcbeautify swiftlint
          xcodegen

      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$id" && test "$id" != null
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build -project Carburants.xcodeproj -scheme Carburants \
            -destination "id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | xcbeautify --renderer github-actions

      - name: Dead code
        # Reports only for now: findings are annotations, the job stays green.
        continue-on-error: true
        env:
          REPORTER: github-actions-logging
        run: scripts/dead-code.sh "$RUNNER_TEMP/build.log"

      - name: Test CarburantsKit
        working-directory: Packages/CarburantsKit
        run: |
          set -o pipefail
          xcodebuild test -scheme CarburantsKit -destination "id=${{ steps.sim.outputs.id }}" \
            | xcbeautify --renderer github-actions
