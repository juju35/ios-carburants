name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          # Swift tools need macOS: SwiftLint runs in its own job below, Periphery in the Build workflow.
          SKIP: swiftlint,periphery

  ruff:
    name: Ruff (annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Findings as annotations on the pull request; warnings fail the job too.
      - run: >
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1
          swiftlint lint --strict --reporter github-actions-logging
